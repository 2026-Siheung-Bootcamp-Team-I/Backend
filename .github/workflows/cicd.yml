name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # CI: 빌드 + 최소 테스트 (PR/푸시 공통, 전 모듈)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + test
        run: ./gradlew build
      - name: Strip plain jars
        if: github.event_name == 'push'
        run: find . -name '*-plain.jar' -delete
      - name: Upload boot jars
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          path: |
            detector-service/build/libs/*.jar
            responder-service/build/libs/*.jar
            archiver-service/build/libs/*.jar
            api-service/build/libs/*.jar
            alert-service/build/libs/*.jar

  # 이미지 빌드 + GHCR 푸시 (main 푸시에만, 모듈별 matrix)
  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [detector-service, responder-service, archiver-service, api-service, alert-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot-jars
      - id: vars
        run: echo "image_base=ghcr.io/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ github.repository }}/${{ matrix.module }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}:latest

  # CD: EC2(k3s) 에 SSH 로 접속해 새 이미지(:SHA)로 롤링. k3s API 를 외부에 노출하지 않는다.
  # 필요한 secret: EC2_HOST(도메인/공인IP), EC2_SSH_KEY(개인키). 선택: EC2_USER(기본 ubuntu).
  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # GHCR 는 소문자 경로만 받으므로 repo 이름을 소문자로 바꿔 원격에 넘긴다.
          REPO_LC="${REPO,,}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "REPO='$REPO_LC' SHA='$SHA' NS=edrdog bash -s" <<'REMOTE'
          set -euo pipefail
          MODULES="detector-service responder-service archiver-service api-service alert-service"
          for m in $MODULES; do
          sudo kubectl -n "$NS" set image "deployment/$m" "$m=ghcr.io/$REPO/$m:$SHA"
          done
          for m in $MODULES; do
          sudo kubectl -n "$NS" rollout status "deployment/$m" --timeout=120s
          done
          REMOTE
