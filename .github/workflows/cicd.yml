name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # CI: 빌드 + 최소 테스트 (PR/푸시 공통, 전 모듈)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + test
        # GeoLite2 mmdb 는 빌드 시점에 받아 jar 에 번들된다. 이 키가 없으면 다운로드를 건너뛰고
        # 빌드는 그대로 성공하지만, 런타임에 GET /api/events/geo 가 항상 빈 배열을 준다(위협 지도가 빈다).
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: ./gradlew build
      - name: Strip plain jars
        if: github.event_name == 'push'
        run: find . -name '*-plain.jar' -delete
      - name: Upload boot jars
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          path: |
            detector-service/build/libs/*.jar
            responder-service/build/libs/*.jar
            archiver-service/build/libs/*.jar
            api-service/build/libs/*.jar
            alert-service/build/libs/*.jar

  # 이미지 빌드 + GHCR 푸시 (main 푸시에만, 모듈별 matrix)
  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [detector-service, responder-service, archiver-service, api-service, alert-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot-jars
      - id: vars
        run: echo "image_base=ghcr.io/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ github.repository }}/${{ matrix.module }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}:latest

  # CD: EC2(k3s) 에 SSH 로 접속해 모니터링 매니페스트를 apply 하고 서비스는 새 이미지(:SHA)로 롤링.
  # k3s API 를 외부에 노출하지 않는다.
  # 필요한 secret: EC2_HOST(도메인/공인IP), EC2_SSH_KEY(개인키). 선택: EC2_USER(기본 ubuntu).
  # 서비스 매니페스트는 apply 하지 않는다(레포와 서버 상태가 어긋나 있어 실서비스가 죽는다).
  # 서비스 환경변수(OTEL_EXPORTER_OTLP_ENDPOINT 등)는 Infisical 로 주입한다.
  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # GHCR 는 소문자 경로만 받으므로 repo 이름을 소문자로 바꿔 원격에 넘긴다.
          REPO_LC="${REPO,,}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "REPO='$REPO_LC' SHA='$SHA' NS=edrdog bash -s" <<'REMOTE'
          set -euo pipefail
          MODULES="detector-service responder-service archiver-service api-service alert-service"

          # 모니터링 스택과 Kafka UI 만 매니페스트로 apply 한다.
          # 서비스 5개 매니페스트는 손대지 않는다. 레포의 api-service Service 는 ClusterIP 인데
          # 서버는 NodePort 30084 로 떠 있어(Caddy 가 이 포트로 프록시) apply 하면 사이트가 죽는다.
          # 서버 브랜치를 건드리지 않으려고 FETCH_HEAD 에서 파일만 꺼내 적용한다.
          if [ -d ~/Backend/.git ]; then
          git -C ~/Backend fetch --quiet origin main
          for f in k8s/otel-lgtm.yaml k8s/alloy.yaml k8s/kafka-ui.yaml; do
          git -C ~/Backend show "FETCH_HEAD:$f" | sudo kubectl apply -f -
          done
          # Infisical 연동은 Operator 가 깔려 있을 때만. 없으면 CRD 가 없어 apply 가 실패하고
          # set -e 때문에 서비스 롤링까지 같이 죽는다.
          if sudo kubectl get crd infisicalsecrets.secrets.infisical.com >/dev/null 2>&1; then
          git -C ~/Backend show "FETCH_HEAD:k8s/infisical.yaml" | sudo kubectl apply -f -
          fi
          sudo kubectl -n "$NS" rollout status deployment/otel-lgtm --timeout=300s
          sudo kubectl -n "$NS" rollout status deployment/alloy --timeout=180s
          sudo kubectl -n "$NS" rollout status deployment/kafka-ui --timeout=180s
          else
          echo "~/Backend 클론이 없어 모니터링 매니페스트 apply 를 건너뛴다" >&2
          fi

          for m in $MODULES; do
          sudo kubectl -n "$NS" set image "deployment/$m" "$m=ghcr.io/$REPO/$m:$SHA"
          done
          for m in $MODULES; do
          sudo kubectl -n "$NS" rollout status "deployment/$m" --timeout=120s
          done
          REMOTE
