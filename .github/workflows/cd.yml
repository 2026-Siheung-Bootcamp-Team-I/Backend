name: CD

on:
  push:
    branches: [main]

jobs:
  # 빌드 + 최소 테스트 후 boot jar 를 다음 잡으로 넘긴다 (전 모듈)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GeoLite2 mmdb 캐시. MaxMind 는 짧은 시간에 여러 번 받으면 429 를 준다(실제로 배포가 막혔다).
      # DB 는 주 단위로 갱신되므로 주차 키로 캐시하면 하루에 몇 번을 빌드해도 한 번만 받는다.
      - name: GeoLite2 캐시
        uses: actions/cache@v4
        with:
          path: api-service/build/geoip
          key: geolite2-${{ hashFiles('api-service/build.gradle') }}-week
          restore-keys: geolite2-
      - name: Build + test
        # GeoLite2 mmdb 는 빌드 시점에 받아 jar 에 번들된다. 이 키가 없으면 다운로드를 건너뛰고
        # 빌드는 그대로 성공하지만, 런타임에 GET /api/events/geo 가 항상 빈 배열을 준다(위협 지도가 빈다).
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: ./gradlew build
      - name: Strip plain jars
        run: find . -name '*-plain.jar' -delete
      - name: Upload boot jars
        uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          path: |
            detector-service/build/libs/*.jar
            responder-service/build/libs/*.jar
            archiver-service/build/libs/*.jar
            api-service/build/libs/*.jar
            alert-service/build/libs/*.jar
            collector-service/build/libs/*.jar

  # 이미지 빌드 + GHCR 푸시 (모듈별 matrix)
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # 한 모듈이 실패해도 나머지는 계속 빌드한다. Docker Hub 에서 베이스 이미지를 받다가
      # 네트워크 타임아웃이 나면(실제로 발생했다) fail-fast 가 멀쩡한 모듈까지 취소시킨다.
      fail-fast: false
      matrix:
        module: [detector-service, responder-service, archiver-service, api-service, alert-service, collector-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot-jars
      - id: vars
        run: echo "image_base=ghcr.io/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ github.repository }}/${{ matrix.module }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 배포서버가 오라클 Ampere A1 이라 amd64 만 올리면 exec format error 로 하나도 안 뜬다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}:latest

  # EC2(k3s) 에 SSH 로 접속해 모니터링 매니페스트를 apply 하고 서비스는 새 이미지(:SHA)로 롤링.
  # k3s API 를 외부에 노출하지 않는다.
  # 필요한 secret: EC2_HOST(도메인/공인IP), EC2_SSH_KEY(개인키). 선택: EC2_USER(기본 ubuntu).
  # 서비스 매니페스트는 apply 하지 않는다(레포와 서버 상태가 어긋나 있어 실서비스가 죽는다).
  # 서비스 환경변수(OTEL_EXPORTER_OTLP_ENDPOINT 등)는 Infisical 로 주입한다.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # GHCR 는 소문자 경로만 받으므로 repo 이름을 소문자로 바꿔 원격에 넘긴다.
          REPO_LC="${REPO,,}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "REPO='$REPO_LC' SHA='$SHA' NS=edrdog bash -s" <<'REMOTE'
          set -euo pipefail
          MODULES="detector-service responder-service archiver-service api-service alert-service collector-service"

          # 인프라 매니페스트는 목록을 적지 않고 k8s/ 를 훑어서 전부 적용한다.
          # 파일을 추가할 때마다 여기도 같이 고쳐야 하면 잊게 되고, 그러면 서버에만 빠진 채로
          # 조용히 지나간다(실제로 portainer.yaml 이 그랬다).
          #   빼는 것: *-service.yaml 은 아래에서 이미지 태그까지 맞춰 따로 다룬다. 여기서 apply 하면
          #            image 가 :latest 로 되돌아갔다가 set image 로 다시 :sha 가 되어 롤아웃이 두 번 돈다.
          #            kind-cluster.yaml 은 로컬 kind 설정이라 apply 대상이 아니고,
          #            infisical.yaml 은 CRD 가 있을 때만 적용한다(바로 아래).
          # 서버 브랜치를 건드리지 않으려고 FETCH_HEAD 에서 파일만 꺼내 적용한다.
          INFRA_FAILED=""
          if [ -d ~/Backend/.git ]; then
          git -C ~/Backend fetch --quiet origin main
          INFRA_DEPLOYS=""
          for f in $(git -C ~/Backend ls-tree --name-only FETCH_HEAD k8s/ | grep '\.yaml$'); do
          case "$(basename "$f" .yaml)" in *-service|kind-cluster|infisical) continue ;; esac
          echo "apply $f" >&2
          APPLIED=$(git -C ~/Backend show "FETCH_HEAD:$f" | sudo kubectl apply -f - -o name)
          echo "$APPLIED" >&2
          INFRA_DEPLOYS="$INFRA_DEPLOYS $(echo "$APPLIED" | grep '^deployment' || true)"
          done
          # Infisical 연동은 Operator 가 깔려 있을 때만. 없으면 CRD 가 없어 apply 가 실패하고
          # set -e 때문에 서비스 롤링까지 같이 죽는다.
          if sudo kubectl get crd infisicalsecrets.secrets.infisical.com >/dev/null 2>&1; then
          git -C ~/Backend show "FETCH_HEAD:k8s/infisical.yaml" | sudo kubectl apply -f -
          fi
          # 인프라가 안 떠도 여기서 멈추지 않는다. kafka-ui·portainer 는 시크릿이 없으면 일부러
          # 안 뜨는데, 운영 UI 때문에 앱 배포가 막히면 곤란하다. 대신 맨 끝에서 CD 를 실패시킨다.
          for d in $INFRA_DEPLOYS; do
          sudo kubectl -n "$NS" rollout status "$d" --timeout=300s || INFRA_FAILED="$INFRA_FAILED $d"
          done
          else
          echo "~/Backend 클론이 없어 인프라 매니페스트 apply 를 건너뛴다" >&2
          fi

          # Deployment 가 없으면(빈 클러스터, 새로 추가된 서비스) 매니페스트를 먼저 apply 한다.
          # 있으면 apply 하지 않는다. image 가 :latest 로 되돌아갔다가 아래 set image 로 다시
          # :sha 가 되면서 롤아웃이 두 번 돌기 때문이다.
          DEPLOYED=""
          for m in $MODULES; do
          if ! sudo kubectl -n "$NS" get deploy "$m" >/dev/null 2>&1; then
          if [ -d ~/Backend/.git ]; then
          echo "deployment/$m 없음 → k8s/$m.yaml 을 apply 한다" >&2
          git -C ~/Backend show "FETCH_HEAD:k8s/$m.yaml" | sudo kubectl apply -f -
          else
          echo "deployment/$m 없음. ~/Backend 클론이 없어 apply 도 못 한다" >&2
          continue
          fi
          fi
          DEPLOYED="$DEPLOYED $m"
          done

          for m in $DEPLOYED; do
          sudo kubectl -n "$NS" set image "deployment/$m" "$m=ghcr.io/$REPO/$m:$SHA"
          done
          for m in $DEPLOYED; do
          sudo kubectl -n "$NS" rollout status "deployment/$m" --timeout=120s
          done

          # 앱은 다 올린 뒤에 인프라 실패를 알린다. 여기서 죽어야 CD 가 초록으로 안 끝난다.
          if [ -n "$INFRA_FAILED" ]; then
          echo "인프라 롤아웃 실패:$INFRA_FAILED" >&2
          echo "kafka-ui·portainer 라면 edrdog-secrets 에 계정 키가 없는 것이다(k8s/README.md)." >&2
          exit 1
          fi
          REMOTE
