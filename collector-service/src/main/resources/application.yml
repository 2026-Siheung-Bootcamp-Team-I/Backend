spring:
  application:
    name: collector
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: collector
      auto-offset-reset: earliest       # 원시 이벤트는 유실 없이 처음부터 정규화
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:                           # 정규화 결과(Event JSON 문자열)를 events 로 발행
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 발행/소비 스팬 생성 → Kafka 를 건너도 traceId 가 이어진다
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8082

edrdog:
  kafka:
    events-raw-topic: events-raw        # 에이전트가 보낸 이벤트 (소비 입력)
    events-topic: events                # 정규화된 이벤트 (재발행 출력, detector/archiver 입력)

management:
  endpoints:
    web:
      exposure:
        include: health, info
  # 관측 — 트레이스만 보낸다(메트릭 익스포터는 api/detector/archiver 에만).
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
