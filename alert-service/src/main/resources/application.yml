spring:
  application:
    name: alert
  config:
    import:
      - classpath:observability.yml
      # 메트릭 익스포터 꺼짐: observability-metrics.yml 을 넣지 않는다.
      # micrometer-registry-otlp 가 없는 서비스라 트레이스만 보낸다(메트릭은 api/detector/archiver 에만).
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.edrdog.alertservice.dto.Alert
        spring.json.trusted.packages: com.edrdog.alertservice.dto
    listener:
      observation-enabled: true         # 컨슈머 스팬 생성 → 발행 측 traceId 를 이어받아 한 트레이스로 연결
      concurrency: 3                    # 파티션 수(3)와 맞춘다. 1이면 스레드 하나가 파티션 3개를 순서대로 훑는다

server:
  port: 8083

edrdog:
  kafka:
    alerts-topic: alerts        # detector 가 발행한 판정 결과 (소비 입력)
  alert:
    cooldown-ms: 60000          # 같은 대상(user 또는 tenant)+host+ruleId 중복 발송 억제 창
  api:
    base-url: ${EDRDOG_API_BASE_URL:http://localhost:8084}   # api-service 내부 엔드포인트 base
    webhook-cache-ttl-ms: 60000                              # tenant webhook 조회 캐시 TTL
  internal:
    key: ${INTERNAL_API_KEY:dev-internal-key}                # 내부 엔드포인트 인증 X-Internal-Key (api-service 와 동일)
