spring:
  application:
    name: responder
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: responder
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.edrdog.responderservice.dto.Alert
        spring.json.trusted.packages: com.edrdog.responderservice.dto
    listener:
      observation-enabled: true         # 컨슈머 스팬 생성 → 발행 측 traceId 를 이어받아 한 트레이스로 연결

server:
  port: 8082

edrdog:
  kafka:
    alerts-topic: alerts        # detector 가 발행한 판정 결과 (소비 입력)
  responder:
    cooldown-ms: 60000          # 같은 host+action 중복 표시 / 재조치 억제 창
    execute:
      enabled: ${RESPONDER_EXECUTE_ENABLED:false}  # 실제 조치 실행 스위치 (기본 OFF = dry-run 유지)
    command:
      timeout-ms: ${RESPONDER_COMMAND_TIMEOUT_MS:30000}  # 에이전트 결과를 기다리는 상한. 넘기면 TIMEOUT
      ttl-ms: ${RESPONDER_COMMAND_TTL_MS:300000}         # 아무도 안 가져간 명령 만료 (호스트가 꺼져 있는 경우)

management:
  endpoints:
    web:
      exposure:
        include: health, info
  # 관측 — 트레이스만 보낸다(메트릭 익스포터는 api/detector/archiver 에만).
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
