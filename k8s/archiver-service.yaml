apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver-service
  namespace: edrdog
  labels:
    app: archiver-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archiver-service
  template:
    metadata:
      labels:
        app: archiver-service
    spec:
      containers:
        - name: archiver-service
          # 배포 시 CI 가 kubectl set image 로 실제 태그(:<sha>) 주입
          image: ghcr.io/2026-siheung-bootcamp-team-i/backend/archiver-service:latest
          ports:
            - containerPort: 8083
          # CLICKHOUSE_PASSWORD 를 여기서 안 받으면 코드 기본값으로 붙는다. 지금은 그 값이 우연히 맞아서 돌아갈 뿐이다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            - name: EDRDOG_CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            # 메트릭/트레이스 OTLP 수집기 (k8s/otel-lgtm.yaml)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-lgtm:4318"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: archiver-service
  namespace: edrdog
  labels:
    app: archiver-service
spec:
  selector:
    app: archiver-service
  ports:
    - port: 80
      targetPort: 8083
