apiVersion: apps/v1
kind: Deployment
metadata:
  name: responder-service
  namespace: edrdog
  labels:
    app: responder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responder-service
  template:
    metadata:
      labels:
        app: responder-service
    spec:
      containers:
        - name: responder-service
          # 배포 시 CI 가 kubectl set image 로 실제 태그(:<sha>) 주입
          image: ghcr.io/2026-siheung-bootcamp-team-i/backend/responder-service:latest
          ports:
            - containerPort: 8082
          # Infisical 이 동기화한 edrdog-secrets. api/alert/detector 등 다른 서비스와 같은 패턴이다.
          # 아래 env 에 같은 이름이 있으면 그쪽이 이긴다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            # --- 실제 조치(kill) 실행 ---
            # 배포서버는 이미 켜져 있고, 이 매니페스트는 그 상태를 그대로 옮긴 것이다.
            # 끄려면 이 값을 "false" 로 바꾸거나 env 를 지운다(지우면 edrdog-secrets 값이 쓰인다).
            # 켠 상태에서 FLEET_BASE_URL 이 https 가 아니면 FleetTls 가 기동을 막는다.
            # Bearer 토큰이 평문으로 나가는 걸 차단하는 의도된 동작이다.
            - name: RESPONDER_EXECUTE_ENABLED
              value: "true"
            - name: FLEET_BASE_URL
              value: "https://fleet.edrdog.svc.cluster.local:8080"
            # Fleet 이 자가서명이라 그 인증서를 담은 truststore 로 검증한다(아래 volume).
            - name: FLEET_TLS_TRUSTSTORE
              value: "/fleet/fleet-truststore.p12"
            - name: FLEET_TLS_TRUSTSTORE_PASSWORD
              value: "changeit"
            - name: FLEET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fleet-creds
                  key: token
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            # 트레이스 OTLP 수집기 (k8s/otel-lgtm.yaml)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-lgtm:4318"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: fleet-ts
              mountPath: /fleet
              readOnly: true
      volumes:
        # Fleet 서버 인증서를 담은 truststore. FLEET_TLS_TRUSTSTORE 가 이 경로를 가리킨다.
        - name: fleet-ts
          secret:
            secretName: fleet-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: responder-service
  namespace: edrdog
  labels:
    app: responder-service
spec:
  selector:
    app: responder-service
  ports:
    - port: 80
      targetPort: 8082
