# Kafdrop — Kafka 토픽/메시지 웹 UI (운영 확인용).
# 배포서버에서는 Caddy 가 https://<도메인>/kafdrop 으로 프록시한다.
#   Caddyfile 예:  handle /kafdrop* { reverse_proxy localhost:30901 }   ← 접두어 유지(handle_path 아님)
#   (서브패스로 서비스하므로 SERVER_SERVLET_CONTEXTPATH 를 /kafdrop 로 맞춰둔다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  namespace: edrdog
  labels:
    app: kafdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop:4.1.0
          ports:
            - containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: "kafka.edrdog.svc.cluster.local:9094"
            - name: SERVER_SERVLET_CONTEXTPATH
              value: "/kafdrop"
            - name: JVM_OPTS
              value: "-Xms64M -Xmx256M"
          readinessProbe:
            httpGet:
              path: /kafdrop/actuator/health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
# NodePort 30901 — 호스트(EC2)에서 도는 Caddy 가 localhost:30901 로 프록시한다.
# EC2 보안그룹에 30901 을 열지 않으면 외부에서 직접은 못 들어오고 Caddy 경유만 가능.
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
  namespace: edrdog
  labels:
    app: kafdrop
spec:
  type: NodePort
  selector:
    app: kafdrop
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30901
