# UI for Apache Kafka (kafbat) — Kafka 토픽/메시지 웹 UI (운영 확인용).
# 배포서버에서는 Caddy 가 https://<도메인>/kafka-ui 로 프록시한다.
#   Caddyfile 예:  handle /kafka-ui* { reverse_proxy localhost:30901 }   ← 접두어 유지(handle_path 아님)
#   (서브패스로 서비스하므로 SERVER_SERVLET_CONTEXT_PATH 를 /kafka-ui 로 맞춰둔다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: edrdog
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "edrdog"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.edrdog.svc.cluster.local:9094"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/kafka-ui"
            # 없으면 주소만 알아도 토픽 메시지(수집 원본)를 읽고 produce·토픽 삭제까지 된다.
            - name: AUTH_TYPE
              value: "LOGIN_FORM"
            # optional 을 주지 않는다. 키가 없으면 인증이 꺼진 채로 뜨는 대신 파드가 멈춘다.
            - name: SPRING_SECURITY_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: edrdog-secrets
                  key: KAFKA_UI_USER
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edrdog-secrets
                  key: KAFKA_UI_PASSWORD
            - name: JAVA_OPTS
              value: "-Xms128M -Xmx512M"
          readinessProbe:
            httpGet:
              path: /kafka-ui/actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
# NodePort 30901, 호스트(EC2)에서 도는 Caddy 가 localhost:30901 로 프록시한다. EC2 보안그룹에 30901 을 열지 않으면 외부에서 직접은 못 들어오고 Caddy 경유만 가능.
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: edrdog
  labels:
    app: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30901
