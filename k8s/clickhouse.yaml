# ClickHouse — 이벤트 저장·조회(archiver/api-server).
# 테이블은 archiver 가 부팅할 때 만든다(CREATE TABLE IF NOT EXISTS). 여기서는 edrdog DB 만 준비.
#   HTTP   8123 -> host localhost:8123
#   native 9000 -> host localhost:9000
#
# 볼륨이 없으면 파드가 갈릴 때마다 이벤트·알림 이력이 전부 사라져 대시보드가 빈다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse
  namespace: edrdog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: edrdog
spec:
  replicas: 1
  # RWO 라 롤링으로 두면 새 파드가 볼륨을 못 잡고 매달린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - containerPort: 8123  # HTTP
            - containerPort: 9000  # native TCP
          env:
            - name: CLICKHOUSE_DB
              value: edrdog
            - name: CLICKHOUSE_USER
              value: edrdog
            - name: CLICKHOUSE_PASSWORD
              value: edrdog
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: edrdog
spec:
  type: NodePort
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30123
    - name: native
      port: 9000
      targetPort: 9000
      nodePort: 30900
