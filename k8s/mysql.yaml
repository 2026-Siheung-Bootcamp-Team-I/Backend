# MySQL — 회원가입/로그인용 유저·조직 저장.
#   TCP 3306 -> host localhost:3306 (HTTP 아님)
#
# 볼륨이 없으면 파드가 갈릴 때마다 가입한 계정이 전부 사라진다. 배포를 안 건드려도
# 노드 재부팅이나 OOM 한 번이면 로그인이 안 되는 상태가 된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql
  namespace: edrdog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: edrdog
spec:
  replicas: 1
  # RWO 라 롤링으로 두면 새 파드가 볼륨을 못 잡고 매달린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: edrdog
            - name: MYSQL_USER
              value: edrdog
            - name: MYSQL_PASSWORD
              value: edrdog
            - name: MYSQL_ROOT_PASSWORD
              value: edrdog
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: edrdog
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306
