syntax = "proto3";

package edrdog.v1;

option java_package = "com.edrdog.schema";
option java_multiple_files = true;
option java_outer_classname = "EventProto";

// 정규화된 엔드포인트 이벤트. events 토픽의 스키마 계약이며 collector 가 쓰고 detector/archiver 가 읽는다.
//
// 필드번호가 곧 전선 위의 이름이다. 번호를 재사용하면 옛 데이터를 엉뚱한 필드로 읽으면서도
// 에러가 나지 않는다. 필드를 뺄 때는 번호를 지우지 말고 reserved 로 막을 것.
// 12개를 15번 안에 둔 것도 의도다. 16번부터는 태그가 1바이트에서 2바이트로 늘어난다.
message Event {
  // 엔드포인트 식별자. detector 의 상관분석 키이자 파티션 키다.
  string host = 1;
  // 이벤트 종류. 값은 EventTypes 상수를 쓴다.
  string type = 2;
  // 발생 시각 (epoch millis). detector 의 event-time 판정 기준.
  int64 ts = 3;
  // 프로세스명/파일명 (예: powershell.exe). dns 는 질의를 낸 프로세스명.
  string process = 4;
  // 부모 프로세스명 (예: winword.exe).
  string parent = 5;
  // 명령행. file/script 이벤트는 판정에 쓰는 전체 경로를 담는다.
  string cmdline = 6;
  // 목적지 IP — network 이벤트. l7 은 핸드셰이크 상대 IP.
  string dest_ip = 7;
  // 목적지 포트 — network 이벤트. l7 은 핸드셰이크 상대 포트.
  int32 dest_port = 8;
  // DNS 질의 이름(dns) 또는 TLS SNI(l7).
  string domain = 9;
  // 타입별 부가정보 JSON 문자열. 구조는 검증하지 않고 그대로 흘린다.
  string detail = 10;
  // 파일 해시. 소문자 64자리 16진수, 모르면 빈 값.
  string sha256 = 11;
  // 조직(tenant) 식별자. 수집 API 가 node_key 로 풀어 심는다.
  string tenant_id = 12;
}
