spring:
  application:
    name: detector
  config:
    import:
      - classpath:observability.yml
      - classpath:observability-metrics.yml   # 메트릭 익스포터 켜짐 (build.gradle 에 micrometer-registry-otlp 있음)
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: detector
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    # 데모 발행 경로: events 로 JSON 문자열 전송
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 조회 경로: alerts 를 되읽어 최근 판정 결과 보관 (RecentAlerts)
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 발행/소비 스팬 생성 → Kafka 를 건너도 traceId 가 이어진다
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8081

edrdog:
  kafka:
    events-topic: events      # 검증을 거친 엔드포인트 이벤트 (판정 입력)
    alerts-topic: alerts      # SUSPECT 결과
