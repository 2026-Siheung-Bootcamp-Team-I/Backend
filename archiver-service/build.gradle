// Archiver — events(archiver)·alerts(archiver-alerts) 를 각각 별도 컨슈머 그룹으로 소비해 ClickHouse 에 적재 (detector 와 독립)
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'   // RestClient (ClickHouse HTTP)
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.core:jackson-databind'        // events/alerts JSON 역직렬화 + JSONEachRow 직렬화
    implementation 'io.micrometer:micrometer-registry-otlp'             // 메트릭 OTLP 전송 (ClickHouse 적재 지연/컨슈머 랙 관측 대상)
}
