spring:
  application:
    name: archiver
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: archiver                # events 전용. alerts 는 AlertKafkaConfig 가 별도 그룹(archiver-alerts)으로 뜬다
      auto-offset-reset: earliest       # 적재는 유실 없이 처음부터 (detector 와 독립 그룹)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 500             # INSERT 한 번에 묶이는 상한 (본문 크기·재시도 시 중복 범위를 이 선으로 제한)
      properties:
        spring.json.value.default.type: com.edrdog.archiverservice.dto.Event
        spring.json.trusted.packages: com.edrdog.archiverservice.dto
    listener:
      type: batch                       # poll 단위로 묶어 ClickHouse INSERT 1회 → 파트가 이벤트 건수만큼 안 생긴다
      observation-enabled: true         # 컨슈머 스팬 생성 → 발행 측 traceId 를 이어받아 한 트레이스로 연결

server:
  port: 8083

edrdog:
  kafka:
    events-topic: events              # 원시 이벤트 (소비 입력)
    alerts-topic: alerts              # 판정기록 (소비 입력, 전용 컨슈머 그룹은 AlertKafkaConfig 참고)
  clickhouse:
    url: http://localhost:8123        # k8s NodePort HTTP
    database: edrdog
    user: edrdog
    password: ${CLICKHOUSE_PASSWORD:edrdog}   # 시크릿은 Infisical 주입, 기본값은 로컬 kind ClickHouse 와 일치
    table: edrdog.events              # events 적재 대상 테이블
    alerts-table: edrdog.alerts       # alerts 적재 대상 테이블

management:
  endpoints:
    web:
      exposure:
        include: health, info
  # 관측 — otel-lgtm(k8s/otel-lgtm.yaml) 으로 OTLP 전송. 스택 없이 개발할 땐 OTEL_ENABLED=false.
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACE_SAMPLING:1.0}      # 데모 규모라 전량 샘플링
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: ${OTEL_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s                                  # 기본 1m 은 데모에서 그래프가 늦게 뜬다
        base-time-unit: seconds                    # Prometheus 관례(초 단위) — 대시보드 쿼리가 이 이름에 맞춰져 있다
  metrics:
    distribution:
      # 버킷을 발행해야 Grafana 에서 p50/p95/p99 를 계산할 수 있다. 끄면 +Inf 버킷만 나가 분위수가 NaN 이 된다.
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms                  # 버킷 개수를 이 범위로 제한 (카디널리티 방어)
      maximum-expected-value:
        http.server.requests: 10s
